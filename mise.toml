# External tools for this Neovim config, managed by mise (https://mise.jdx.dev).
# Provision with `mise install` (scripts/setup.sh runs this for you).
#
# These are the tools the config invokes directly — pickers, git UI, the
# treesitter CLI, and the formatters/linters wired into conform & nvim-lint.
# LSP servers are NOT here: Mason installs those itself on first file open.
#
# Not managed by mise:
#   - rust-analyzer : `rustup component add rust-analyzer` (used by rustaceanvim)
#   - pint / phpstan: project-local composer deps

[tools]
# Language runtimes (Mason's LSP servers and the go: backend build on these)
node = "lts"
go = "latest"
rust = "stable"

# Pickers (snap), git UI, treesitter CLI
ripgrep = "latest"
fd = "latest"
"tree-sitter" = "latest"
lazygit = "latest"

# Formatters / linters (conform & nvim-lint)
stylua = "latest"
shfmt = "latest"
"npm:oxfmt" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
# Not the language server (mason installs golangci-lint-langserver); this is the
# binary that server — and conform's `golangci-lint fmt --stdin` — shells out to.
# A project pinning its own version in mise.toml wins over this one, since both
# are invoked through `mise exec --`.
golangci-lint = "latest"
